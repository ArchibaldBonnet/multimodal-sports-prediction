# Canonical configuration — design decision (d).
# The temporal split is defined ONCE, here, and consumed identically
# by the sklearn baseline and the multimodal LSTM.

split:
  method: "sequential"
  train_ratio: 0.80      # train: chronologically first 80% of matches
  test_ratio: 0.20       # test: chronologically last 20% of matches (used for backtest)

paths:
  raw_matches: "data/raw/matches_PL.csv"
  raw_odds: "data/raw/odds_PL.csv"
  raw_news: "data/raw/news.csv"
  matches_canonical: "data/processed/matches.parquet"      
  team_embeddings: "data/embeddings/team_embeddings.pt"    
  news_embeddings: "data/embeddings/news_embeddings.pt"    
  dataset: "data/processed/dataset.parquet"                

models:
  baseline:
    output: "models/baseline.pkl"
  lstm:
    output: "models/lstm.pt"
    sequence_length: 5
    hidden_size: 64
    num_layers: 2
    loss_log: "reports/lstm_training_log.csv"   

evaluation:
  output: "reports/log_loss_comparison.csv"

backtesting:
  initial_bankroll: 1000.0
  kelly_fraction: 4.0
  min_edge: 0.00
  max_bet_pct: 0.25
  output: "reports/matched_bets_log.csv"