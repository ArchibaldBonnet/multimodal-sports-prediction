[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsp"
version = "0.1.0"
description = "Multimodal Premier League match prediction: calibrated sklearn baseline vs multimodal LSTM, validated via Kelly-criterion backtesting."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "joblib",
    "requests",
    "python-dotenv",
    "scikit-learn",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
